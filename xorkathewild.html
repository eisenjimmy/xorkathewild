(()=>{
'use strict';

/* ================= helpers: numbers, noise, matrices ================= */

const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
function srand(seed){let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const hex=h=>{const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz)||1;xx/=l;xy/=l;xz/=l;const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;

  o[12]=(a[5]*b07-a[4]*b09-a[6]*b06)*d;o[13]=(a[0]*b09-a[1]*b07+a[2]*b06)*d;o[14]=(a[13]*b01-a[12]*b03-a[14]*b00)*d;o[15]=(a[8]*b03-a[9]*b01+a[10]*b00)*d;return o},
 // post-multiplying builders: m = m * T

 rz(m,a){const c=Math.cos(a),s=Math.sin(a);for(let i=0;i<4;i++){const x=m[i],y=m[4+i];m[i]=x*c+y*s;m[4+i]=y*c-x*s}return m},
 clone(m){return new Float32Array(m)},
 xf(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z+m[12],m[1]*x+m[5]*y+m[9]*z+m[13],m[2]*x+m[6]*y+m[10]*z+m[14]]},
 xn(m,x,y,z){return[m[0]*x+m[4]*y+m[8]*z,m[1]*x+m[5]*y+m[9]*z,m[2]*x+m[6]*y+m[10]*z]},

/* ================= WebGL: cel-shading programs and a little mesh builder ================= */
const cv=document.getElementById('gl'),uiCv=document.getElementById('ui'),ui=uiCv.getContext('2d');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,preserveDrawingBuffer:!!window.__keepGL});
if(!gl){document.body.innerHTML='<p style="font:16px sans-serif;color:#234;padding:24px">xOrka the Wild needs WebGL 2. Try a recent Chrome, Edge, Firefox or Safari.</p>';throw new Error('no webgl2')}
let VW=1,VH=1,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,window.__dpr||1.75);VW=Math.max(1,Math.round(innerWidth*DPR));VH=Math.max(1,Math.round(innerHeight*DPR));

addEventListener('resize',resize);resize();

 gl.bindAttribLocation(p,0,'aPos');gl.bindAttribLocation(p,1,'aNor');gl.bindAttribLocation(p,2,'aCol');gl.bindAttribLocation(p,3,'aWind');gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));const U={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);

const NL=8;
// toon: a hard-but-soft terminator, cool blue shadows, a warm rim, torchlight, fog into the sky. uOutline>0 turns it into the inverted-hull ink pass
const TOON=program(`
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNor;layout(location=2) in vec3 aCol;layout(location=3) in float aWind;
uniform mat4 uVP,uM;uniform mat3 uN;uniform float uTime,uOutline,uSway;uniform vec3 uCam;
out vec3 vN,vC,vW;out float vD;
void main(){vec3 p=aPos;
 if(aWind>0.){float ph=uTime*1.9+p.x*.35+p.z*.27;vec3 wp=(uM*vec4(p,1.)).xyz;ph=uTime*1.9+wp.x*.31+wp.z*.23;p.x+=sin(ph)*aWind*uSway;p.z+=cos(ph*.8)*aWind*uSway*.6;}
 vec4 w=uM*vec4(p,1.);vec3 n=normalize(uN*aNor);
 if(uOutline>0.){float d=length(w.xyz-uCam);w.xyz+=n*uOutline*clamp(d*.06,.6,3.);}
 vW=w.xyz;vN=n;vC=aCol;vD=length(w.xyz-uCam);gl_Position=uVP*w;}`,`
float sat2(float v){return clamp(v,0.,1.);}
in vec3 vN,vC,vW;in float vD;out vec4 o;
uniform vec3 uSun,uSunCol,uAmb,uShadow,uFogCol,uCam,uInk,uMul;uniform vec2 uFog;uniform float uOutline,uEmis,uAlpha,uLK;uniform vec4 uTint;

// the sky: a soft gradient, a sun and puffy clouds, all from the view ray
const SKY=program(`layout(location=0) in vec3 aPos;out vec2 vP;void main(){vP=aPos.xy;gl_Position=vec4(aPos.xy,.9999,1.);}`,`
in vec2 vP;out vec4 o;uniform mat4 uIVP;uniform vec3 uSun,uTop,uHor,uGround;uniform float uTime,uCloud;

void main(){vec4 a=uIVP*vec4(vP,-1.,1.),b=uIVP*vec4(vP,1.,1.);vec3 d=normalize(b.xyz/b.w-a.xyz/a.w);
 float y=d.y;vec3 c=mix(uHor,uTop,pow(max(y,0.),.6));if(y<0.)c=mix(uHor,uGround,min(-y*3.,1.));

 if(y>0.&&uCloud>0.){vec2 q=d.xz/(y+.12)*1.4+vec2(uTime*.012,uTime*.004);float k=fb(q);float m=smoothstep(.55,.62,k)*smoothstep(0.,.25,y);
  vec3 cc=mix(vec3(.82,.88,1.),vec3(1.),smoothstep(.6,.75,k));c=mix(c,cc,m*uCloud);}

// particles: round puffs, stars, petals and leaves as point sprites
const PART=program(`layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNor;layout(location=2) in vec3 aCol;layout(location=3) in float aWind;
uniform mat4 uVP;uniform float uScale;out vec3 vC;out float vA,vK;
void main(){vec4 p=uVP*vec4(aPos,1.);gl_Position=p;gl_PointSize=clamp(aNor.x*uScale/max(p.w,.1),1.,256.);vC=aCol;vA=aNor.y;vK=aNor.z;}`,`
in vec3 vC;in float vA,vK;out vec4 o;
void main(){vec2 p=gl_PointCoord*2.-1.;float r=length(p),a;

 else if(vK<1.5){float ang=atan(p.y,p.x);float st=.45+.35*cos(ang*5.);a=1.-smoothstep(st-.08,st+.08,r);}

const WATER=program(`layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNor;layout(location=2) in vec3 aCol;
uniform mat4 uVP;uniform float uTime;uniform vec3 uCam;out vec3 vW,vC;out float vD;
void main(){vec3 p=aPos;p.y+=sin(uTime*1.3+p.x*.4)*.04+cos(uTime*1.1+p.z*.5)*.04;vW=p;vC=aCol;vD=length(p-uCam);gl_Position=uVP*vec4(p,1.);}`,`
in vec3 vW,vC;in float vD;out vec4 o;uniform float uTime;uniform vec3 uFogCol,uDeep,uShal;uniform vec2 uFog;
void main(){float depth=vC.r;vec3 c=mix(uShal,uDeep,smoothstep(0.,1.,depth));

/* ---------- meshes: positions, normals, colours and a wind weight, interleaved ---------- */
class MB{constructor(){this.d=[];this.m=null;this.nm=null}
 at(m){this.m=m;this.nm=m?M4.nrm(m):null;return this}
 v(p,n,c,w=0){let x=p[0],y=p[1],z=p[2],nx=n[0],ny=n[1],nz=n[2];if(this.m){[x,y,z]=M4.xf(this.m,x,y,z);const q=this.nm;const a=q[0]*nx+q[3]*ny+q[6]*nz,b=q[1]*nx+q[4]*ny+q[7]*nz,cc=q[2]*nx+q[5]*ny+q[8]*nz,l=Math.hypot(a,b,cc)||1;nx=a/l;ny=b/l;nz=cc/l}

  this.quad(P(0,1,0),P(0,1,1),P(1,1,1),P(1,1,0),t);this.quad(P(0,0,0),P(1,0,0),P(1,0,1),P(0,0,1),mulc(col,.8));
  this.quad(P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1),col);this.quad(P(1,0,0),P(0,0,0),P(0,1,0),P(1,1,0),col);

 // smooth ellipsoid; colFn(nx,ny,nz) may paint it (bellies, eyes, moss)

  for(let j=0;j<rows;j++)for(let i=0;i<seg;i++){const a=P(i,j),b=P(i+1,j),c=P(i+1,j+1),d=P(i,j+1);
   if(j>0){this.v(a.p,a.n,a.c,wind);this.v(b.p,b.n,b.c,wind);this.v(c.p,c.n,c.c,wind)}if(j<rows-1){this.v(a.p,a.n,a.c,wind);this.v(c.p,c.n,c.c,wind);this.v(d.p,d.n,d.c,wind)}}}

   const n0=[c0,sl,s0],n1=[c1,sl,s1];const A=[x+c0*r0,y,z+s0*r0],B=[x+c1*r0,y,z+s1*r0],C=[x+c1*r1,y+h,z+s1*r1],D=[x+c0*r1,y+h,z+s0*r1];
   this.v(A,n0,col);this.v(C,n1,col);this.v(B,n1,col);this.v(A,n0,col);this.v(D,n0,col);this.v(C,n1,col);
   if(caps){if(r1>0)this.tri([x,y+h,z],C,D,topCol||col,topCol||col,topCol||col,[0,1,0]);if(r0>0)this.tri([x,y,z],A,B,mulc(col,.8),mulc(col,.8),mulc(col,.8),[0,-1,0])}}}

 for(const key in raw){IN[key]=raw[key];IN[key+'P']=raw[key]&&!PREV[key];PREV[key]=raw[key]}
 // pad navigation for menus
 if(pad){const up=pb(12)||(pad.axes[1]||0)<-.6,dn=pb(13)||(pad.axes[1]||0)>.6,lf=pb(14)||(pad.axes[0]||0)<-.6,rt=pb(15)||(pad.axes[0]||0)>.6,a=pb(0),b=pb(1);
  if(up&&!PADP.up)menuKey('ArrowUp');if(dn&&!PADP.dn)menuKey('ArrowDown');if(lf&&!PADP.lf)menuKey('ArrowLeft');if(rt&&!PADP.rt)menuKey('ArrowRight');if(a&&!PADP.a&&G.state!=='play')menuKey('Enter');if(b&&!PADP.b&&G.state==='pause')menuKey('Escape');PADP={up,dn,lf,rt,a,b}}}
function menuKey(code){const menu=G.state==='title'||G.state==='pause'||G.state==='dead';
 if(G.confirm){if(code==='ArrowLeft'||code==='ArrowRight'||code==='KeyA'||code==='KeyD'){G.confSel=1-G.confSel;SFX.tick()}else if(code==='Enter'||code==='Space'){const C2=G.confirm;G.confirm=null;SFX.click();if(G.confSel===0)C2.yes()}else if(code==='Escape')G.confirm=null;return}
 if(G.state==='talk'&&(code==='Enter'||code==='Space'||code==='KeyE'||code==='KeyF')){dlgAdvance();return}
 if(G.state==='end'&&G.endT>4){toTitle();return}
 if(code==='KeyM'){audioInit();setMuted(!AU.muted)}
 if(G.state==='play'&&(code==='Escape'||code==='KeyP')&&!G.cut){G.state='pause';G.menuSel=0;if(document.exitPointerLock)document.exitPointerLock();return}
 if(G.state==='pause'&&(code==='Escape'||code==='KeyP')){G.state='play';return}
 if(!menu||!G.menuItems)return;const n=G.menuItems.length;
 if(code==='ArrowUp'||code==='KeyW'){G.menuSel=(G.menuSel+n-1)%n;G.kbMenu=true;SFX.tick()}else if(code==='ArrowDown'||code==='KeyS'){G.menuSel=(G.menuSel+1)%n;G.kbMenu=true;SFX.tick()}
 else if(code==='Enter'||code==='Space'){if(!G.kbMenu){G.kbMenu=true;return}const it=G.menuItems[G.menuSel];if(it){if(G.confirm===null)G.confSel=0;it[1]();if(G.confirm)G.confSel=0}}}
/* ---------- cutscenes ---------- */
function cutUpdate(dt){const C2=G.cut;const t0=C2.t;C2.t+=dt;const at=s=>t0<s&&C2.t>=s;
 if(C2.kind==='intro'){if(at(.2))banner('PUFFWOOD VALE','A SUNNY MORNING');if(C2.t>=C2.dur){G.cut=null;toast('ELDER HOOT IS WAVING AT YOU. WALK OVER AND PRESS E TO TALK.')}}
 else if(C2.kind==='door'){for(let i=0;i<3;i++)if(at(.8+i*.8)){tone(880+i*220,.5,'sine',.1,1,0,null,.5);puff(C2.o.x-1.6+i*1.6,C2.o.y+5.75,C2.o.z+.4,14,[[1,1,.7],[.7,1,1]],{k:1,spd:2.5,size:.35,life:.8})}
  if(at(3.3)){FLAGS.shrineOpen=1;C2.o.c.on=false;SFX.door();shake(.5);SFX.solved()}if(C2.t>=C2.dur){G.cut=null;save();toast('THE SHRINE IS OPEN! STEP INSIDE.')}}
 else if(C2.kind==='boss'){if(C2.t>=C2.dur){G.cut=null;toast('MOSSMAW HATES PURPLE SNEEZES. LURE IT NEAR A MUSHROOM!',4.5)}}
 else if(C2.kind==='bossEnd'){if(C2.t>=C2.dur){G.cut=null;endingTalk()}}}
/* ---------- the update ---------- */
function stepThings(dt){for(const o of SC.things){if(o.dead)continue;const K=KIND[o.k];if(K.upd)K.upd(o,dt)}if(SC.things.some(o=>o.dead&&(o.k==='cloud'||o.k==='heart'||o.k==='slime')))SC.things=SC.things.filter(o=>!(o.dead&&(o.k==='cloud'||o.k==='heart'||o.k==='slime')))}
function update(dt){G.clock+=dt;pollInput(dt);G.pushing=0;
 if(G.state==='title'){stepThings(dt);stepParticles(dt)}
 else if(G.state==='play'){if(IN.pauseP&&!G.cut){menuKey('Escape')}
  if(G.cut){cutUpdate(dt);IN.jumpP=IN.stickP=IN.actP=false;const keep={mx:IN.mx,mz:IN.mz,water:IN.water};IN.mx=IN.mz=0;IN.water=false;playerUpdate(dt);Object.assign(IN,keep)}
  else{playerUpdate(dt);if(IN.actP&&G.state==='play'){const p=promptTarget();if(p)KIND[p.o.k].act(p.o)}G.time+=dt}
  stepThings(dt);stepDrops(dt);stepParticles(dt);dungeonUpdate(dt);
  if(SC.id==='field'&&!G.cut&&G.state==='play'){G.autoT=(G.autoT||0)+dt;if(G.autoT>25&&P.ground&&safeSpot(P.x,P.z)){G.autoT=0;save()}}}
 else if(G.state==='talk'){if(IN.actP||IN.jumpP||IN.stickP)dlgAdvance();stepThings(dt*.5);stepParticles(dt)}
 else if(G.state==='end'){stepParticles(dt);if((IN.jumpP||IN.actP||IN.stickP)&&G.endT>4)toTitle()}
 else stepParticles(dt);
 if(IN.pauseP&&G.state==='pause'&&false)G.state='play'}
function toTitle(){G.state='title';G.cut=null;G.dlg=null;G.confirm=null;G.menuSel=0;G.saveInfo=peekSave();useScene('field');P.x=0;P.z=-900;P.y=-50;playSong('title');if(document.exitPointerLock)document.exitPointerLock()}
let last=0;
function loop(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;try{update(dt);updateCamera(dt);render(dt);drawUI(dt);musicTick()}catch(e){console.error(e);if(window.__errs)window.__errs.push(String(e&&e.stack||e))}requestAnimationFrame(loop)}
function boot(){ui.fillStyle='#8fd3f4';ui.fillRect(0,0,VW,VH);const u=VH/360;text('LOADING THE VALE...',VW/2,VH/2,2*u,'#fff','center','#4a3a5a');
 setTimeout(()=>{buildMeshes();toTitle();G.state='title';requestAnimationFrame(loop)},30)}
boot();

})();
</script>
